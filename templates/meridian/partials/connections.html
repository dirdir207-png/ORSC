<section class="m-connections" data-connections-root>

      <p class="m-workspace-kicker">Settings · Connections</p>
      <h1>Your financial picture,<br>connected.</h1>
      <p>Meridian uses trusted connections to keep your financial picture current—so you can decide with confidence.</p>
    </div>
    <button class="m-primary-button" type="button" data-add-connection>Add connection</button>

  <p class="m-inline-error" data-connections-error role="alert" hidden></p>

  <p class="m-settings-payday-link">
    Payday frequency or funding source changed?
    <a href="/meridian/settings?section=payday">Manage payday &amp; funding</a>
  </p>
</section>
