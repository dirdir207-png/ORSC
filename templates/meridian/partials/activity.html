<div class="m-activity" data-activity-root>
  <div class="m-activity-toolbar">
    <div class="m-segmented" role="group" aria-label="Activity mode">
      <button type="button" class="m-button" data-activity-mode="timeline" aria-pressed="true">Timeline</button>
      <button type="button" class="m-button" data-activity-mode="review" aria-pressed="false">Review</button>
      <button type="button" class="m-button" data-activity-mode="patterns" aria-pressed="false">Patterns</button>
    </div>
    <label class="m-field">
      <span class="m-field-label">Account</span>
      <select class="m-select" data-account-filter>
        <option value="">All accounts</option>
      </select>
    </label>
    <span class="m-chip" data-freshness data-state="unavailable"></span>
  </div>

  <div class="m-ledger" data-ledger></div>

  <button type="button" class="m-button" data-batch-review hidden>Review selected</button>

  <p class="m-empty-note" data-activity-empty hidden>No transactions yet.</p>

  <button type="button" class="m-button" data-load-more hidden>Load more</button>

  <p class="m-inline-error" data-activity-error role="alert" hidden></p>

  <div data-memory-activity aria-label="Activity memory items"></div>
</div>
